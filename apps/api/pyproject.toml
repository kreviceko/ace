[project]
name = "ace-studio"
version = "0.1.0"
description = "Local music studio UI wrapping ACE-Step 1.5"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.18",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "aiofiles>=24.0.0",
  "openai>=3.19.2",
]

[project.optional-dependencies]
gradio = ["gradio>=5.0.0"]
stems = [
    "demucs>=4.1.0",
    "soundfile>=0.14.0",
]

[project.scripts]
ace-studio = "ace_studio.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ace_studio"]
